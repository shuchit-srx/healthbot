services:
  backend:
    image: ${BACKEND_ECR_URI}:latest
    container_name: healthbot-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - healthbot-network

  frontend:
    image: ${FRONTEND_ECR_URI}:latest
    container_name: healthbot-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - healthbot-network

  caddy:
    image: caddy:2-alpine
    container_name: healthbot-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - healthbot-network

networks:
  healthbot-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
